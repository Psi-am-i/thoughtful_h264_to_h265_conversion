name: Release builds

# Builds the distributable GUI apps. PyInstaller cannot cross-compile, so each OS
# bundle is produced on a runner of that OS:
#   - windows-latest -> VeryThoughtfulCompression-windows.zip (.exe onedir + ffmpeg/ffprobe.exe;
#       runtime functionally probes nvenc/qsv/amf and uses whatever the machine has, else software)
#   - macos-latest   -> VeryThoughtfulCompression-macos.zip   (.app, arm64 / Apple Silicon,
#       arm64 ffmpeg with working VideoToolbox — the build gates on this)
# NOTE: the macOS build verifies hevc_videotoolbox actually encodes on the runner. If a
# GitHub macOS runner lacks VideoToolbox the job fails by design — build on a real Apple
# Silicon Mac with packaging/build_gui_app.sh (the authoritative path).
# On a v* tag the zips are attached to a GitHub release. Also runnable by hand
# from the Actions tab (workflow_dispatch) to get artifacts without a release.
#
# Both bundles are UNSIGNED. To ship signed/notarized builds, add the signing
# steps from packaging/BUILD.md (Apple Developer ID + notarytool; signtool).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg (GPL, has libx264/libx265)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tooling
        run: python -m pip install --quiet pytest

      - name: Engine tests (real ffmpeg encodes + decisions)
        # pytest is the gate: it collects every test, including any that need a
        # fixture. The standalone loop below then proves the files still run on
        # their own — which had quietly stopped being true, hiding five tests
        # from CI because they were defined after the __main__ block.
        run: PYTHONPATH=. python -m pytest tests/ -q

      - name: Tests also run standalone (no pytest)
        run: |
          for t in tests/test_*.py; do echo "== $t =="; PYTHONPATH=. python "$t"; done

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download static ffmpeg + ffprobe (GPL build, gyan.dev)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffbuild
          $ff = Get-ChildItem ffbuild -Recurse -Filter ffmpeg.exe  | Select-Object -First 1
          $fp = Get-ChildItem ffbuild -Recurse -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $ff.FullName "$env:GITHUB_WORKSPACE\ffmpeg.exe"
          Copy-Item $fp.FullName "$env:GITHUB_WORKSPACE\ffprobe.exe"
          & "$env:GITHUB_WORKSPACE\ffmpeg.exe" -version | Select-Object -First 1
      - name: Install build deps
        run: pip install pyinstaller pywebview
      - name: PyInstaller build
        env:
          FFMPEG_BINARY_PATH: ${{ github.workspace }}\ffmpeg.exe
          FFPROBE_BINARY_PATH: ${{ github.workspace }}\ffprobe.exe
        run: pyinstaller --clean --noconfirm --distpath dist-win --workpath build-win packaging/vtc-gui-win.spec
      - name: Verify bundle contents (a hang exits zero — assert the pieces shipped)
        shell: bash
        run: |
          # The Windows failure modes (missing WinForms host / pythonnet runtime)
          # produce no crash and no log — the app just hangs. So assert the bundle
          # instead of trusting a green build. (WINDOWS-GOTCHAS.md #8)
          root="dist-win/VeryThoughtfulCompression"
          toc="$(find build-win -name 'Analysis-00.toc' | head -1)"
          fail=0
          need_file(){ find "$root" -iname "$1" | grep -q . || { echo "MISSING file: $1"; fail=1; }; }
          need_mod(){ grep -q "'$1'" "$toc" || { echo "MISSING module: $1"; fail=1; }; }
          need_file "Python.Runtime.dll"      # pythonnet <-> .NET bridge (gotcha #1)
          need_file "ffmpeg.exe"; need_file "ffprobe.exe"; need_file "vtc_app_v3.html"
          need_mod "webview.platforms.winforms"     # the real Windows host, not just the renderer
          need_mod "webview.platforms.edgechromium"
          need_mod "clr_loader"
          [ "$fail" = 0 ] && echo "bundle verification passed" || { echo "BUNDLE VERIFICATION FAILED"; exit 1; }
      - name: Add licenses + README, zip
        shell: bash
        run: |
          source packaging/lib_licenses.sh
          FFVER="$(./ffmpeg.exe -version | head -1)"
          write_ffmpeg_licenses "dist-win/VeryThoughtfulCompression/licenses" "$FFVER"
          cp packaging/APP_README.txt dist-win/VeryThoughtfulCompression/README.txt
          cd dist-win && 7z a ../VeryThoughtfulCompression-windows.zip VeryThoughtfulCompression
      - uses: actions/upload-artifact@v4
        with:
          name: VeryThoughtfulCompression-windows
          path: VeryThoughtfulCompression-windows.zip

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build .app (downloads static ffmpeg + ffprobe)
        env:
          PYTHON: python3
        run: packaging/build_gui_app.sh
      - name: Rename zip
        run: mv packaging/dist-gui/VeryThoughtfulCompression.zip VeryThoughtfulCompression-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VeryThoughtfulCompression-macos
          path: VeryThoughtfulCompression-macos.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release and attach builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes \
            VeryThoughtfulCompression-windows.zip VeryThoughtfulCompression-macos.zip \
          || gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --clobber VeryThoughtfulCompression-windows.zip VeryThoughtfulCompression-macos.zip
