[project]
name = "vtc"
version = "0.1.0"
description = "Very Thoughtful Compression — codec-aware, quality-density video re-encoder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8"]

[project.scripts]
vtc = "vtc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vtc"]
