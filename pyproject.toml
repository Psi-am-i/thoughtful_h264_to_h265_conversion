[project]
name = "vtc"
version = "0.1.0"
description = "Very Thoughtful Compression — codec-aware, quality-density video re-encoder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gui = ["pywebview>=5.0"]
dev = ["pytest>=8"]

[project.scripts]
vtc = "vtc.cli:main"

[project.gui-scripts]
vtc-gui = "vtc.webapp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vtc"]

# ship the GUI's HTML inside the wheel so `pip install` + `vtc-gui` is self-contained
[tool.hatch.build.targets.wheel.force-include]
"vtc/vtc_app_v3.html" = "vtc/vtc_app_v3.html"
